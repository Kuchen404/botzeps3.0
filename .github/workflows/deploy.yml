name: Deploy

# Nach jedem grünen CI-Lauf auf main: Image bauen, nach GHCR pushen und die Portainer-Stacks per Webhook neu starten.
# Einrichtung: README, Abschnitt „Automatisches Deployment“.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kuchen404/botzeps3.0

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Kurzen Commit-Hash ermitteln
        id: commit
        run: echo "kurz=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.kurz }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Portainer-Stacks neu starten
        env:
          WEBHOOK_DEMO: ${{ secrets.PORTAINER_WEBHOOK_DEMO }}
          WEBHOOK_PROD: ${{ secrets.PORTAINER_WEBHOOK_PROD }}
        # Die Webhook-URLs sind selbst das Geheimnis und werden nie ausgegeben.
        run: |
          ausloesen() {
            local name="$1" url="$2"
            if [ -z "$url" ]; then
              echo "::notice::$name übersprungen: Secret PORTAINER_WEBHOOK_${name^^} ist nicht gesetzt."
              return 0
            fi
            curl -fsS -X POST -o /dev/null "$url"
            echo "$name: Portainer-Webhook ausgelöst"
          }
          ausloesen demo "$WEBHOOK_DEMO"
          ausloesen prod "$WEBHOOK_PROD"
          echo "Image: $IMAGE:sha-${{ steps.commit.outputs.kurz }}"
