name: Deploy

# Nach jedem grünen CI-Lauf auf main: Code per SSH auf den Server kopieren und den Bot neu bauen und starten.
# Einrichtung und benötigte Secrets: README, Abschnitt „Automatisches Deployment“.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Secrets prüfen
        id: pruefen
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deployment übersprungen: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH und DEPLOY_SSH_KEY als Secrets setzen."
            echo "aktiv=false" >> "$GITHUB_OUTPUT"
          else
            echo "aktiv=true" >> "$GITHUB_OUTPUT"
            # "~/ordner" als Pfad relativ zum Home-Verzeichnis behandeln
            echo "DEPLOY_DIR=${DEPLOY_PATH#\~/}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: steps.pruefen.outputs.aktiv == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH einrichten
        if: steps.pruefen.outputs.aktiv == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Code übertragen
        if: steps.pruefen.outputs.aktiv == 'true'
        # Nur Dateien aus Git; .env und die Daten-Volumes auf dem Server bleiben unberührt.
        run: |
          git archive --format=tar HEAD | ssh server "mkdir -p \"$DEPLOY_DIR\" && tar -x -C \"$DEPLOY_DIR\""

      - name: Neu bauen und starten
        if: steps.pruefen.outputs.aktiv == 'true'
        run: |
          ssh server "DEPLOY_DIR='$DEPLOY_DIR' COMMIT='$(git rev-parse --short HEAD)' bash -s" <<'SKRIPT'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          test -f .env || { echo "::error::$DEPLOY_DIR/.env fehlt auf dem Server"; exit 1; }

          # Test-Bot nur mitnehmen, wenn er vorher lief
          demo_lief=false
          if docker compose --profile demo ps --status running --services | grep -qx botzeps-demo; then
            demo_lief=true
          fi

          docker compose build botzeps
          docker compose up -d botzeps
          if [ "$demo_lief" = true ]; then
            docker compose --profile demo up -d botzeps-demo
          fi

          # Auf den Healthcheck aus dem Dockerfile warten
          id=$(docker compose ps -q botzeps)
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$id")
            [ "$status" = healthy ] && break
            sleep 4
          done
          if [ "$status" != healthy ]; then
            echo "::error::botzeps ist nach dem Start nicht gesund (Status: $status)"
            docker compose logs --tail 50 botzeps
            exit 1
          fi

          docker image prune -f > /dev/null
          echo "botzeps läuft mit $COMMIT$( [ "$demo_lief" = true ] && echo ', Test-Bot ebenfalls neu gestartet')"
          SKRIPT
