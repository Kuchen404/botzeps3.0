<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Botzeps</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --c1: #1f77b4; --c2: #d62728; --c3: #2ca02c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg2); color: var(--text); }
  header { padding: 14px 16px 6px; }
  h1 { font-size: 20px; margin: 0; }
  select { margin-top: 6px; width: 100%; padding: 8px; border-radius: 10px; border: 0; background: var(--bg); color: var(--text); font-size: 15px; }
  nav { display: flex; gap: 4px; padding: 8px 16px; position: sticky; top: 0; background: var(--bg2); z-index: 2; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: 1 0 auto; padding: 8px 6px; white-space: nowrap; border: 0; border-radius: 10px; background: var(--bg); color: var(--text); font-size: 13px; }
  nav button.aktiv { background: var(--button); color: var(--button-text); }
  main { padding: 0 16px 24px; }
  .karte { background: var(--bg); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .karte h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 8px; font-weight: 600; }
  .gross { font-size: 34px; font-weight: 700; }
  .zeile { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--bg2); }
  .zeile:last-child { border-bottom: 0; }
  .ich { font-weight: 700; }
  .hint { color: var(--hint); font-size: 13px; }
  .balken { height: 10px; background: var(--bg2); border-radius: 5px; overflow: hidden; margin: 6px 0 2px; }
  .balken > div { height: 100%; background: var(--button); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chips button { border: 1px solid var(--hint); background: none; color: var(--text); border-radius: 14px; padding: 4px 10px; font-size: 13px; }
  .chips button.aktiv { background: var(--button); color: var(--button-text); border-color: var(--button); }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  svg text { fill: var(--hint); font-size: 11px; }
  .tipp { min-height: 20px; font-size: 13px; margin-top: 4px; }
  .knopf { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--button); color: var(--button-text); font-size: 14px; }
  .knopf.leise { background: var(--bg2); color: var(--text); }
  .knopf.weg { background: none; color: var(--danger); padding: 8px 4px; }
  .eintrag { padding: 10px 0; border-bottom: 1px solid var(--bg2); }
  .eintrag:last-child { border-bottom: 0; }
  .aktionen { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .aktionen select { width: auto; margin: 0; background: var(--bg2); }
  label.schalter { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  input[type=time] { font-size: 16px; padding: 6px; border-radius: 8px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); }
  .fehler { color: var(--danger); padding: 16px; }
  /* Eintragen */
  .feld { margin-bottom: 4px; }
  .feld > .hint { display: block; margin-bottom: 4px; }
  .chips input, .werte input { font-size: 16px; padding: 4px 8px; border-radius: 14px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); }
  .chips input { width: 84px; }
  .chips input.breit { width: 140px; }
  /* Zahlenfelder wie die Knöpfe: ohne Pfeile, Fokus in der Knopffarbe statt Browser-Rahmen */
  .chips input, .werte input { -moz-appearance: textfield; appearance: textfield; }
  .chips input::-webkit-inner-spin-button, .chips input::-webkit-outer-spin-button,
  .werte input::-webkit-inner-spin-button, .werte input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .chips input:focus, .werte input:focus { outline: none; border-color: var(--button); box-shadow: 0 0 0 1px var(--button); }
  .chips select { width: auto; margin: 0; padding: 4px 8px; border-radius: 14px; border: 1px solid var(--hint); font-size: 13px; }
  .chips select.aktiv { background: var(--button); color: var(--button-text); border-color: var(--button); }
  .werte { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .werte label { font-size: 13px; color: var(--hint); }
  .werte input { width: 100%; border-radius: 10px; padding: 8px; margin-top: 2px; }
  .senden { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .senden .knopf { padding: 10px 18px; font-size: 15px; }
  .knopf:disabled { opacity: .45; }
  /* Ränge und Erfolge */
  .rangkopf { display: flex; align-items: center; gap: 12px; }
  .rangkopf .emoji { font-size: 52px; line-height: 1; }
  .leiter .zeile.offen { opacity: .45; }
  .leiter .zeile.jetzt { font-weight: 700; }
  .erfolge { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .erfolg { background: var(--bg2); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.3; }
  .erfolg b { display: block; font-size: 14px; }
  .erfolg.zu { opacity: .45; }
  /* Ruhmeshalle */
  .halle-wahl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .halle-wahl button { border: 1px solid var(--hint); background: none; color: var(--text); border-radius: 14px; padding: 4px 10px; font-size: 13px; }
  .halle-wahl button.aktiv { background: var(--button); color: var(--button-text); border-color: var(--button); }
  .mehr { border: 0; background: none; color: var(--link); padding: 8px 0 0; font-size: 14px; }
  /* Boss-Kampf */
  .arena { position: relative; border-radius: 12px; padding: 12px 8px 10px; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 50% 35%, #5b2a86 0%, #26123d 70%); }
  .arena.stufe2 { background: radial-gradient(circle at 50% 35%, #a3171d 0%, #3b0a0c 70%); }
  .lp { position: relative; height: 16px; border-radius: 8px; background: rgba(255,255,255,.18); overflow: hidden; margin: 0 6px; }
  .lp > .rest { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff3b30, #ff9500); transition: width .35s ease-out; }
  .lp > .text { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  .bossplatz { position: relative; height: 170px; display: flex; align-items: center; justify-content: center; }
  .bossbild { font-size: 92px; line-height: 1; animation: schweben 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .stufe2 .bossbild { font-size: 116px; animation: schweben 1.6s ease-in-out infinite, wut 0.8s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 14px #ff2d2d) drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  .bossbild.gezeichnet { font-size: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .bossbild.gezeichnet > svg { width: 150px; height: 140px; display: block; }
  .stufe2 .bossbild.gezeichnet { filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  .stufe2 .bossbild.gezeichnet > svg { width: 176px; height: 164px; }
  .muckis { position: absolute; font-size: 34px; top: 58px; }
  .muckis.l { left: 18%; transform: scaleX(-1); } .muckis.r { right: 18%; }
  .bossplatz.tot .muckis { opacity: 0; transition: opacity .5s; }
  .bossplatz.tot .bossbild { animation: none; transform: rotate(90deg) translateY(10px); opacity: .45; filter: grayscale(1); transition: all .8s ease-in; }
  .stempel { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-size: 26px; font-weight: 900;
    padding: 2px 10px; border: 3px solid currentColor; border-radius: 6px; letter-spacing: .06em; animation: stempeln .4s ease-out; }
  .stempel.sieg { color: #34c759; } .stempel.niederlage { color: #ffcc00; }
  .zahl { position: absolute; left: 50%; top: 40%; font-weight: 900; font-size: 22px; color: #ffcc00; text-shadow: 0 2px 3px #000; pointer-events: none;
    animation: aufsteigen .9s ease-out forwards; }
  .faust { position: absolute; font-size: 22px; pointer-events: none; z-index: 2; }
  .kaempfer { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; margin-top: 6px; }
  .kaempfer > div { width: 58px; text-align: center; font-size: 11px; line-height: 1.2; }
  .avatar { width: 40px; height: 40px; margin: 0 auto 3px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; border: 2px solid rgba(255,255,255,.7); }
  .kaempfer .ich .avatar { border-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
  .kaempfer .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kaempfer .schaden { opacity: .8; }
  .bossinfo { margin-top: 8px; }
  .arena.illustriert { background: radial-gradient(ellipse at 50% 48%, #354350, #171d2c 72%); padding-top: 16px; }
  .arena.illustriert.stufe2 { background: radial-gradient(ellipse at 50% 48%, #4c3549, #201b2c 72%); }
  .illustriert .bossplatz { height: 230px; }
  .bossbild.neu, .stufe2 .bossbild.neu { animation: none; }
  .bossbild.neu > svg, .stufe2 .bossbild.neu > svg { width: 250px; height: 230px; max-width: 100%; }
  .bossplatz.tot .bz-figure, .bossplatz.tot .bz-figure * { animation: none !important; }
  .trefferfunken { position: absolute; left: 50%; top: 48%; width: 70px; height: 70px; pointer-events: none;
    background: #ffe8a8; clip-path: polygon(50% 0,58% 32%,86% 12%,69% 42%,100% 50%,69% 58%,86% 88%,58% 68%,50% 100%,42% 68%,14% 88%,31% 58%,0 50%,31% 42%,14% 12%,42% 32%);
    animation: trefferfunken .3s ease-out forwards; }
  @keyframes trefferfunken { from { transform: translate(-50%,-50%) scale(.3) rotate(-15deg); opacity: .9; } to { transform: translate(-50%,-50%) scale(1.3) rotate(15deg); opacity: 0; } }
  /* Spielerfiguren */
  .kaempfer > div.mitfigur { width: 54px; }
  .figur { position: relative; width: 54px; height: 80px; margin: 0 auto 2px; }
  .figur > svg { position: absolute; inset: 0; width: 54px; height: 80px; overflow: visible; }
  .figur > .bz-spieler-illustriert { transform-origin: 50% 95%; }
  .figur[data-pose="bereit"] > .bz-spieler-illustriert { animation: spieler-bereit 2.6s ease-in-out infinite; }
  .figur[data-pose="jubel"] > .bz-spieler-illustriert { animation: spieler-jubel .65s ease-in-out 3; }
  @keyframes spieler-bereit { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025,.98); } }
  @keyframes spieler-jubel { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px) rotate(-2deg); } }
  .figur::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 40px; height: 9px; transform: translateX(-50%); background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); }
  .kaempfer .ich .figur::before { width: 50px; height: 12px; background: radial-gradient(ellipse, #ffcc00, rgba(255,204,0,.35) 45%, transparent 70%); }
  .kaempfer .ich .name { color: #ffcc00; font-weight: 700; }
  .kaempfer .pennt .schaden { color: #ff9f9f; }
  .zzz { position: absolute; right: 0; top: 0; font-weight: 900; font-size: 11px; color: #bfe8ff; transform: rotate(-12deg); }
  .figurwahl { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .figurwahl button { border: 2px solid transparent; border-radius: 12px; background: var(--bg2); color: var(--text); padding: 4px 2px 6px; font-size: 11px; line-height: 1.2; }
  .figurwahl button svg { width: 60px; height: 88px; display: block; margin: 0 auto; }
  .figurwahl button.meine { border-color: #ffcc00; box-shadow: 0 0 8px rgba(255,204,0,.6); }
  .figurwahl button:disabled { opacity: .4; }
  .figurwahl button.verdeckt { opacity: 1; background: repeating-linear-gradient(135deg, var(--bg2) 0 8px, rgba(127,127,127,.12) 8px 16px); color: var(--hint); }
  .figurwahl .fragezeichen { display: flex; align-items: center; justify-content: center; width: 60px; height: 88px; margin: 0 auto; font-size: 40px; font-weight: 900; }
  .figurwahl .wer { display: block; color: var(--hint); font-size: 10px; }

  /* Minispiel der Woche */
  .regel { margin: 0 0 8px; }
  .spielstatus { font-weight: 700; margin-bottom: 8px; }
  .berg { width: 100%; height: auto; display: block; margin-bottom: 8px; }
  .seil { position: relative; height: 10px; border-radius: 5px; margin: 14px 4px 6px; background: repeating-linear-gradient(90deg, #a0742c 0 8px, #c8964a 8px 16px); }
  .seil > .knoten { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #ff3b30; box-shadow: 0 1px 3px rgba(0,0,0,.5); transition: left .6s ease-out; }
  .seilteams { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .code { font: 800 34px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .25em; text-align: center; margin: 4px 0 10px; }
  @keyframes schweben { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes wut { from { scale: 1; } to { scale: 1.06; } }
  @keyframes aufsteigen { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }
  @keyframes stempeln { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bossbild, .stufe2 .bossbild, .stempel, .zahl, .trefferfunken, .figur > .bz-spieler-illustriert { animation: none !important; } .bossplatz.tot .bossbild, .lp > .rest { transition: none; } }
  /* {{MINISPIEL_STILE}} */
</style>
</head>
<body>
<header>
  <h1 id="titel">Botzeps</h1>
  <select id="season" hidden></select>
</header>
<nav>
  <button data-tab="stand" class="aktiv">Stand</button>
  <button data-tab="ruhm">Ruhm</button>
  <button data-tab="halle">Halle</button>
  <button data-tab="waage">Waage</button>
  <button data-tab="eintraege">Eintragen</button>
  <button data-tab="einstellungen">Mehr</button>
</nav>
<main id="inhalt"><p class="hint">Lädt …</p></main>

<script nonce="{{NONCE}}">
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
var daten = null, eintraege = null, eingabeDaten = null, ruhmDaten = null, tab = "stand", seasonIndex = 0, waageReihe = "fettPct";
var inhalt = document.getElementById("inhalt");
var halle = { chat: null, alleRaenge: false, alleSieger: false };

/** Fingerabdruck dieser Seite; der Server schickt seinen bei jeder Antwort mit. */
var VERSION = "{{VERSION}}";
/**
 * Nach einem Deploy läuft eine minimierte Mini App mit altem Code weiter und bekäme neue Daten.
 * Dann einmal neu laden, aber nicht mitten in einer Eingabe und höchstens einmal je neuer Version.
 */
function pruefeVersion(r, body) {
  var neu = r.headers.get("x-botzeps-version");
  if (!neu || neu === VERSION || body || ["stand", "ruhm", "halle"].indexOf(tab) < 0) return false;
  try {
    if (sessionStorage.getItem("botzeps-neu-geladen") === neu) return false;
    sessionStorage.setItem("botzeps-neu-geladen", neu);
  } catch (e) { return false; }
  location.reload();
  return true;
}

function api(pfad, body) {
  return fetch(pfad, {
    method: body ? "POST" : "GET",
    headers: { "Authorization": "tma " + (tg ? tg.initData : ""), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    if (pruefeVersion(r, body)) return new Promise(function () {});
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.fehler || "Fehler " + r.status); return j; });
  });
}

function el(tag, attrs, kinder) {
  var e = document.createElement(tag);
  for (var k in attrs || {}) {
    if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (kinder || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function zahl(x, stellen) { return x == null ? "–" : x.toLocaleString("de-DE", { maximumFractionDigits: stellen == null ? 1 : stellen }); }
function datum(d) { var t = d.split("-"); return t[2] + "." + t[1] + "."; }
function karte(titel, kinder) { return el("div", { class: "karte" }, [titel ? el("h2", { text: titel }) : null].concat(kinder)); }
function zeile(links, rechts, klasse) { return el("div", { class: "zeile" + (klasse ? " " + klasse : "") }, [el("span", { text: links }), el("span", { text: rechts })]); }

/** Liniendiagramm mit Antippen: zeigt die Werte am nächsten Punkt. */
/** `achse` (optional): Beschriftung je x-Punkt, null = Zwischenpunkt ohne Beschriftung und Punkt. */
function diagramm(x, reihen, einheit, achse) {
  var NS = "http://www.w3.org/2000/svg", B = 340, H = 200, L = 36, R = 10, O = 10, U = 24;
  var werte = [];
  reihen.forEach(function (r) { r.werte.forEach(function (w) { if (w != null) werte.push(w); }); });
  if (!werte.length) return el("p", { class: "hint", text: "Noch keine Daten." });
  var min = Math.min.apply(null, werte), max = Math.max.apply(null, werte);
  if (einheit === "Punkte") { min = Math.min(0, min); max = Math.max(0, max); }
  if (max - min < 1) { max += 0.5; min -= 0.5; }
  // Runde Achsenschritte (1, 2, 5 × 10^k)
  var roh = (max - min) / 4, basis = Math.pow(10, Math.floor(Math.log10(roh)));
  var schrittY = [1, 2, 5, 10].map(function (f) { return f * basis; }).filter(function (v) { return v >= roh; })[0];
  min = Math.floor(min / schrittY) * schrittY; max = Math.ceil(max / schrittY) * schrittY;
  var px = function (i) { return L + (x.length <= 1 ? (B - L - R) / 2 : i * (B - L - R) / (x.length - 1)); };
  var py = function (w) { return O + (1 - (w - min) / (max - min)) * (H - O - U); };
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + B + " " + H);
  function neu(tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  for (var w = min; w <= max + schrittY / 1000; w += schrittY) {
    var y = py(w);
    neu("line", { x1: L, x2: B - R, y1: y, y2: y, stroke: "currentColor", "stroke-opacity": Math.abs(w) < schrittY / 1000 ? "0.35" : "0.12" });
    neu("text", { x: L - 4, y: y + 4, "text-anchor": "end" }).textContent = zahl(Math.abs(w) < schrittY / 1000 ? 0 : w, schrittY < 1 ? 1 : 0);
  }
  var schritt = Math.ceil(x.length / 6), letzte = x.length - 1;
  if (achse) {
    // Je eine Beschriftung und feine Trennlinie pro Woche; bei vielen Wochen nur jede zweite beschriftet
    var marken = [];
    achse.forEach(function (t, i) { if (t != null) marken.push(i); });
    var jede = Math.ceil(marken.length / 7);
    marken.forEach(function (i, k) {
      if (i > 0) neu("line", { x1: px(i), x2: px(i), y1: O, y2: H - U, stroke: "currentColor", "stroke-opacity": "0.08" });
      if ((marken.length - 1 - k) % jede === 0 || k === 0) neu("text", { x: px(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === letzte ? "end" : "middle" }).textContent = achse[i];
    });
  } else x.forEach(function (t, i) {
    // Die letzte Beschriftung immer, die davor nur mit genug Abstand
    if (i === letzte || (i % schritt === 0 && letzte - i >= schritt * 0.7)) neu("text", { x: px(i), y: H - 6, "text-anchor": x.length > 1 && i === letzte ? "end" : i === 0 && x.length > 1 ? "start" : "middle" }).textContent = t;
  });
  var farben = ["var(--c1)", "var(--c2)", "var(--c3)"];
  reihen.forEach(function (r, ri) {
    var d = "", offen = false;
    r.werte.forEach(function (w, i) { if (w == null) { offen = false; return; } d += (offen ? "L" : "M") + px(i).toFixed(1) + " " + py(w).toFixed(1) + " "; offen = true; });
    neu("path", { d: d, fill: "none", stroke: farben[ri % 3], "stroke-width": achse ? "2" : "2.5", "stroke-linejoin": "round" });
    var zuletzt = -1;
    r.werte.forEach(function (w, i) { if (w != null) zuletzt = i; });
    // Mit Achse nur an Wochenenden und am aktuellen Tag ein Punkt

/** Mount Botzeps mit allen Kletterern, abwechselnd auf beiden Hängen, damit sie sich nicht verdecken. */

  neu("polygon", { points: (M - 34) + "," + (G + 34) + " " + M + "," + G + " " + (M + 34) + "," + (G + 34) + " " + (M + 12) + "," + (G + 28) + " " + (M - 10) + "," + (G + 38), fill: "#f4f6fa" });

  neu("text", { x: M + 4, y: G - 4, "font-size": "18" }, "🚩");
  neu("text", { x: 4, y: H - 2, "font-size": "11", fill: "currentColor", "fill-opacity": ".6" }, "⛺ Basislager");

  if (rest.length) {
    var imRest = rest.some(function (x) { return x.id === training.sportart; });
    var mehr = el("select", { "aria-label": "Andere Sportart", class: imRest ? "aktiv" : "" }, [el("option", { value: "", text: "Andere …" })].concat(
      rest.map(function (x) { return el("option", { value: String(x.id), text: x.name }); })));
    if (imRest) mehr.value = String(training.sportart);
    mehr.addEventListener("change", function () { if (mehr.value) { training.sportart = Number(mehr.value); zeichne(); } });
    sportChips.appendChild(mehr);
  }
  kinder.push(feld("Sportart", sportChips));

  var dauerChips = chips(e.dauern.map(function (d) { return { wert: d, text: d + " min" }; }), training.minuten, function (w) { training.minuten = w; });
  var eigene = el("input", { type: "number", inputmode: "numeric", min: String(e.minuten.min), max: String(e.minuten.max), placeholder: "andere", "aria-label": "Minuten" });
  if (training.minuten && e.dauern.indexOf(training.minuten) < 0) eigene.value = String(training.minuten);
  eigene.addEventListener("input", function () { training.minuten = eigene.value ? Number(eigene.value) : null; knopf.disabled = !bereit(); });
  dauerChips.appendChild(eigene);
  kinder.push(feld("Dauer", dauerChips));
  // Beim Spazieren zählt mit Schritten das Tempo: 110 pro Minute ×1, 120 ×2, 130 ×3
  var gewaehlt = gruppe.sportarten.find(function (x) { return x.id === training.sportart; });
  if (gewaehlt && gewaehlt.nachSchritten) {
    var schritte = el("input", { type: "number", inputmode: "numeric", min: "1", placeholder: "z. B. 7200", "aria-label": "Schritte", class: "breit" });
    if (training.schritte) schritte.value = String(training.schritte);
    schritte.addEventListener("input", function () { training.schritte = schritte.value ? Number(schritte.value) : null; });
    kinder.push(feld("Schritte von diesem Spaziergang (nicht vom ganzen Tag, flott bis ×3)", el("div", { class: "chips" }, [schritte])));
  } else {
    training.schritte = null;
  }
  kinder.push(feld("Wann", chips(TAGE, training.tage, function (w) { training.tage = w; })));

  function bereit() { return training.sportart != null && training.minuten >= e.minuten.min && training.minuten <= e.minuten.max; }
  var status = el("span", { class: "hint", text: training.status });
  var knopf = el("button", { type: "button", class: "knopf", text: "Eintragen", onclick: function () {
    if (!bereit()) { status.textContent = "Dauer bitte zwischen " + e.minuten.min + " und " + e.minuten.max + " Minuten."; return; }
    knopf.disabled = true; status.textContent = "Trägt ein …";
    api("/api/training", { chat: training.chat, sportart: training.sportart, minuten: training.minuten, tage: training.tage, schritte: training.schritte }).then(function (j) {
      erfolg();
      training.status = j.text; training.minuten = null; training.schritte = null; training.tage = 0;
      return neuLaden();
    }).catch(function (f) { knopf.disabled = false; status.textContent = f.message; });
  } });
  knopf.disabled = !bereit();
  kinder.push(el("div", { class: "senden" }, [knopf, status]));
  return karte("🏃 Training", kinder);
}

function messungKarte() {
  var letzte = eingabeDaten.letzteMessung || {};
  var felder = [["gewichtKg", "Gewicht kg"], ["fettPct", "Fett %"], ["muskelPct", messung.muskelKg ? "Muskel kg" : "Skelettmuskel %"]].map(function (f) {
    var vorschlag = letzte[f[0]];
    // Im kg-Modus die letzte Muskelmasse in kg vorschlagen, gespeichert ist sie in % vom Gewicht
    if (f[0] === "muskelPct" && messung.muskelKg) vorschlag = letzte.muskelPct != null && letzte.gewichtKg != null ? letzte.muskelPct * letzte.gewichtKg / 100 : null;
    var eingabe = el("input", { type: "text", inputmode: "decimal", autocomplete: "off", placeholder: vorschlag != null ? zahl(vorschlag) : "" });
    eingabe.value = messung[f[0]];
    eingabe.addEventListener("input", function () { messung[f[0]] = eingabe.value; });
    return el("label", {}, [f[1], eingabe]);
  });
  var status = el("span", { class: "hint", text: messung.status });
  function wert(k) { var t = String(messung[k]).trim().replace(",", "."); return t === "" ? NaN : Number(t); }
  function sende(trotzdem) {
    var body = { gewichtKg: wert("gewichtKg"), fettPct: wert("fettPct"), muskelPct: wert("muskelPct"), tage: messung.tage };
    if ([body.gewichtKg, body.fettPct, body.muskelPct].some(isNaN)) { status.textContent = "Bitte alle drei Werte eintragen."; return; }
    // Muskelmasse in kg als Anteil am Gewicht, wie auf dem Server bei /waage … kg
    if (messung.muskelKg) body.muskelPct = Math.round(body.muskelPct / body.gewichtKg * 10000) / 100;
    if (trotzdem) body.trotzdem = true;
    knopf.disabled = true; status.textContent = "Speichert …";
    api("/api/messung", body).then(function (j) {
      if (!j.ok) {
        knopf.disabled = false; status.textContent = "";
        bestaetige("Das weicht stark von deinem Schnitt der letzten 7 Tage ab (" + zahl(j.sprung.gewichtKg) + " kg, Fett " + zahl(j.sprung.fettPct) + " %). Stimmt das so?", function () { sende(true); });
        return;
      }
      erfolg();
      messung = { gewichtKg: "", fettPct: "", muskelPct: "", muskelKg: messung.muskelKg, tage: 0, status: j.text.split("\n").join(" · ") };
      return neuLaden();
    }).catch(function (f) { knopf.disabled = false; status.textContent = f.message; });
  }
  var knopf = el("button", { type: "button", class: "knopf", text: "Speichern", onclick: function () { sende(false); } });
  return karte("⚖️ Waage (nur für dich)", [
    el("div", { class: "werte" }, felder),
    feld("Muskel in", chips([{ wert: false, text: "%" }, { wert: true, text: "kg" }], messung.muskelKg, merkeMuskelEinheit)),
    feld("Wann", chips(TAGE, messung.tage, function (w) { messung.tage = w; })),
    el("div", { class: "senden" }, [knopf, status]),
    el("p", { class: "hint", text: "Fett % = Körperfett. Muskel % = Skelettmuskulatur, falls deine Waage die zeigt, sonst Muskelrate. Nur kg? Auf kg umschalten, die App rechnet in % vom Gewicht um. Immer denselben Wert nehmen." }),
    el("p", { class: "hint", text: "Morgens, nach dem Klo, vor Essen und Trinken, immer dieselbe Waage." })
  ]);
}

function eintraegeTab() {
  if (!eintraege || !eingabeDaten) {
    Promise.all([api("/api/eintraege"), api("/api/eingabe")]).then(function (j) { eintraege = j[0]; eingabeDaten = j[1]; zeichne(); }).catch(zeigeFehler);
    return [el("p", { class: "hint", text: "Lädt …" })];
  }
  var formulare = [trainingKarte(), messungKarte()];
  if (!eintraege.eintraege.length) return formulare.concat([karte(null, [el("p", { text: "Noch nichts eingetragen." })])]);
  var liste = eintraege.eintraege.map(function (e) {
    var text = e.art === "t"
      ? "🏃 " + datum(e.datum) + " " + e.minuten + " min " + e.sportart + (e.schritte ? " (" + e.schritte.toLocaleString("de-DE") + " Schritte)" : "")
      : "⚖️ " + datum(e.datum) + " " + zahl(e.gewichtKg) + " kg · " + zahl(e.fettPct) + " % · " + zahl(e.muskelPct) + " %";
    var kinder = [];
    if (e.umstellbar) {
      kinder.push(el("button", { class: "knopf", text: "War " + e.variante.split(" ").pop(), onclick: function () {
        aendere("/api/eintrag/variante", { id: e.id });
      } }));
    }
    if (e.aenderbar) {
      if (e.art === "t") {
        var auswahl = el("select", { "aria-label": "Neue Dauer" }, [el("option", { value: "", text: "Dauer ändern" })].concat(
          eintraege.dauern.filter(function (d) { return d !== e.minuten; }).map(function (d) { return el("option", { value: String(d), text: d + " min" }); })));
        auswahl.addEventListener("change", function () {
          if (!auswahl.value) return;
          aendere("/api/eintrag/dauer", { id: e.id, minuten: Number(auswahl.value) });
        });
        kinder.push(auswahl);
      }
      kinder.push(el("button", { class: "knopf weg", text: "Löschen", onclick: function () {
        bestaetige("Wirklich löschen?", function () { aendere("/api/eintrag/loeschen", { art: e.art, id: e.id }); });
      } }));
    }
    var aktionen = kinder.length ? el("div", { class: "aktionen" }, kinder) : null;
    return el("div", { class: "eintrag" }, [el("div", { text: text }), aktionen]);
  });
  return formulare.concat([karte("Letzte Einträge", liste.concat([el("p", { class: "hint", text: "Ändern und löschen geht bis 2 Tage zurück." })]))]);
}

function einstellungenTab() {
  var e = daten.einstellungen;
  var an = el("input", { type: "checkbox" }); an.checked = e.erinnerungen;
  var zeit = el("input", { type: "time", value: e.uhrzeit, step: "60" });
  var status = el("span", { class: "hint" });
  function speichere() {
    status.textContent = "Speichert …";
    api("/api/einstellungen", { erinnerungen: an.checked, uhrzeit: zeit.value }).then(function () {
      e.erinnerungen = an.checked; e.uhrzeit = zeit.value; status.textContent = "Gespeichert ✓";
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }).catch(function (f) { status.textContent = f.message; });
  }
  an.addEventListener("change", speichere);
  zeit.addEventListener("change", speichere);
  return [
    figurKarte(),
    karte("Erinnerungen", [
      el("label", { class: "schalter" }, ["Erinnerungen an", an]),
      el("label", { class: "schalter" }, ["Uhrzeit", zeit]),
      status,
      el("p", { class: "hint", text: "Privat, wenn du 3 Tage nicht trainiert oder 4 Tage nicht gemessen hast, und in der Kalibrierwoche." })
    ]),
    karte("Datenschutz", [el("p", { class: "hint", text: "Deine Waagenwerte siehst nur du. Die Gruppe sieht nur Punkte." })])
  ];
}

var figurDaten = null;
/** Eigene Kämpferfigur der Season aussuchen: einmalig, ab dem ersten Training in der ersten Boss-Woche; jede Figur gibt es pro Season nur einmal. */
function figurKarte() {
  var s0 = daten.seasons[seasonIndex];
  // Kein Spoiler: vor der Freischaltung nur verdeckte Karten, Bilder werden gar nicht erst geladen
  if (!s0 || !s0.figur || (s0.figur.meine == null && !s0.figur.darfWaehlen)) return verdeckteFiguren(s0);
  if (!figurDaten || figurDaten.verdeckt) {
    api("/api/figuren").then(function (j) { figurDaten = j; if (tab === "einstellungen") zeichne(); }).catch(zeigeFehler);
    return karte("Deine Kämpferfigur", [el("p", { class: "hint", text: "Lädt …" })]);
  }
  var s = daten.seasons[seasonIndex];
  var d = s.figur, waehlbar = d.darfWaehlen && d.meine == null;
  var text = d.meine != null ? "Das ist deine Figur für „" + s.name + "“. Gewählt ist gewählt."
    : waehlbar ? "Such dir eine aus! Gewählt ist gewählt."
    : "";
  var status = el("p", { class: "hint", text: text });
  var raster = el("div", { class: "figurwahl" }, figurDaten.figuren.map(function (f) {
    f = { nr: f.nr, name: f.name, bild: f.bild, vergeben: d.meine === f.nr ? null : d.vergeben[f.nr] || null };
    var knopf = el("button", { class: f.nr === d.meine ? "meine" : "", "aria-label": f.name }, []);
    var bild = el("span"); bild.innerHTML = f.bild; // fester Baukasten vom eigenen Server
    knopf.appendChild(bild);
    knopf.appendChild(el("span", { text: f.name }));
    if (f.vergeben) knopf.appendChild(el("span", { class: "wer", text: f.vergeben }));
    knopf.disabled = !waehlbar || !!f.vergeben;
    if (f.nr === d.meine) knopf.disabled = false;
    knopf.addEventListener("click", function () {
      if (!waehlbar) return;
      bestaetige("„" + f.name + "“ nehmen? Danach lässt sie sich nicht mehr ändern.", function () {
        status.textContent = "Speichert …";
        api("/api/figur", { chat: s.chat, figur: f.nr }).then(function () {
          erfolg(); return neuLaden();
        }).catch(function (e) { status.textContent = e.message; });
      });
    });
    return knopf;
  }));
  return karte("Deine Kämpferfigur", [raster, status, el("p", { class: "hint", text: "Deine Figur kämpft für dich gegen die Bosse und taucht in den Minispielen auf." })]);
}

function verdeckteFiguren(s) {
  // Kein Spoiler: weder Wort noch Bild verraten, was hier kommt
  var d = s && s.figur;
  var raster = el("div", { class: "figurwahl" }, Array.apply(null, Array(12)).map(function () {
    return el("button", { class: "verdeckt", disabled: "", "aria-label": "Verdeckt" }, [el("span", { class: "fragezeichen", text: "?" }), el("span", { text: "???" })]);
  }));
  return karte("Geheimnis", [raster, d && d.freiAb ? el("p", { class: "hint", text: "Hier tut sich ab dem " + datum(d.freiAb) + " was." }) : null]);
}

function bestaetige(frage, dann) {
  if (tg && tg.showConfirm) tg.showConfirm(frage, function (ok) { if (ok) dann(); });
  else if (window.confirm(frage)) dann();
}

function aendere(pfad, body) {
  api(pfad, body).then(function () {
    erfolg();
    return neuLaden();
  }).catch(zeigeFehler);
}

function zeigeFehler(f) {
  if (tg && tg.showAlert) tg.showAlert(f.message); else alert(f.message);
}

function zeichne() {
  if (tauziehenAbbrechen) tauziehenAbbrechen();
  if (zombieAbbrechen) zombieAbbrechen();
  if (bombenAbbrechen) bombenAbbrechen();
  if (tresorAbbrechen) tresorAbbrechen();
  tresorDarstellung = null;
  if (bossKampfAbbrechen) bossKampfAbbrechen();
  if (kopfgeldAbbrechen) kopfgeldAbbrechen();
  if (gipfelAbbrechen) gipfelAbbrechen();
  gipfelDarstellung = null;
  var s = daten.seasons[seasonIndex];
  var kinder = tab === "stand" ? standTab(s) : tab === "ruhm" ? ruhmTab() : tab === "halle" ? halleTab() : tab === "waage" ? waageTab() : tab === "eintraege" ? eintraegeTab() : einstellungenTab();
  inhalt.replaceChildren.apply(inhalt, kinder.filter(Boolean));
}

function zeigeTab(name) {
  tab = name;
  document.querySelectorAll("nav button").forEach(function (x) { x.classList.toggle("aktiv", x.getAttribute("data-tab") === name); });
  if (daten) zeichne();
}
document.querySelectorAll("nav button").forEach(function (b) {
  b.addEventListener("click", function () { zeigeTab(b.getAttribute("data-tab")); });
});

document.getElementById("season").addEventListener("change", function (ev) { seasonIndex = Number(ev.target.value); zeichne(); });

if (!tg || !tg.initData) {
  inhalt.replaceChildren(el("p", { class: "fehler", text: "Bitte in Telegram über den Botzeps-Knopf öffnen." }));
} else {
  api("/api/ich").then(function (j) {
    daten = j;
    document.getElementById("titel").textContent = "💪 " + j.name;
    var auswahl = document.getElementById("season");
    if (j.seasons.length > 1) {
      auswahl.hidden = false;
      j.seasons.forEach(function (s, i) { auswahl.appendChild(el("option", { value: String(i), text: s.gruppe + ": " + s.name })); });
      // Aus einer Gruppe geöffnet (startapp=g<chat>): deren Season zuerst zeigen
      var start = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
      var aus = start.charAt(0) === "g" ? j.seasons.findIndex(function (s) { return String(s.chat) === start.slice(1); }) : -1;
      if (aus >= 0) { seasonIndex = aus; auswahl.value = String(aus); }
    }
    zeichne();
  }).catch(function (f) { inhalt.replaceChildren(el("p", { class: "fehler", text: f.message })); });
}
</script>
</body>
